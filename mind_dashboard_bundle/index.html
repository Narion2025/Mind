<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gateway Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Gateway Dashboard</h1>
  <button id="addBtn">Neuen GPT hinzufügen</button>
  <table id="anchors">
    <thead><tr><th>ID</th><th>Name</th><th>Model</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>

  <div id="modal" class="hidden">
    <form id="anchorForm">
      <label>ID <input id="gpt_id" required></label>
      <label>Name <input id="identity" required></label>
      <label>Model
        <select id="model">
          <option value="gpt-4o">gpt-4o</option>
          <option value="claude-3">claude-3</option>
          <option value="gemini-pro">gemini-pro</option>
        </select>
      </label>
      <label>Version <input id="version" value="1.0.0"></label>
      <button type="submit">Save</button>
      <button type="button" id="cancelBtn">Cancel</button>
    </form>
  </div>

  <script src="main.js"></script>
</body>
</html>
