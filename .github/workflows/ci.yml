name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m py_compile voice_pipeline/*.py
      - name: Run tests
        run: pytest -q
      - name: Validate thoughts
        run: python MIND_CI_Validation/scripts/validate_thoughts.py
