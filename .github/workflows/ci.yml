name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt flake8
      - run: flake8 mind_bus_api.py
      - run: pytest -q
      - run: docker build -t mind-api .
